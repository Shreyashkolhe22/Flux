name: Release

# Manual only: Actions tab, "Release", Run workflow, and give a tag such as v1.0.1.
# It builds the Windows installer and the Android APKs on GitHub's servers and
# attaches them to that release. (It is not triggered by tags, so releases made by
# hand on the Releases page do not start a second build.)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.1
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installer
        working-directory: laptop
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: laptop/dist/Flux-Setup-*.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # One APK per CPU type keeps each download around 20-25 MB instead of 65 MB.
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  release:
    needs: [windows-installer, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            artifacts/Flux-Setup-*.exe
            artifacts/app-arm64-v8a-release.apk
            artifacts/app-armeabi-v7a-release.apk
          generate_release_notes: true
